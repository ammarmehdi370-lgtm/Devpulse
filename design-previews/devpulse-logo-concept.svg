<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title description">
  <title id="title">Devpulse logo concept</title>
  <desc id="description">A minimal geometric D monogram with an integrated pulse line, a refined Devpulse wordmark, and a compact app icon.</desc>
  <rect width="1120" height="400" rx="24" fill="#080c0d"/>
  <rect x="1" y="1" width="1118" height="398" rx="23" fill="none" stroke="#1e2928" stroke-width="2"/>

  <g aria-label="Devpulse primary mark">
    <path d="M111 124h31a61 61 0 0 1 0 122h-31z" fill="none" stroke="#0df5c4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M126 185h22l11-19 15 39 13-22h16" fill="none" stroke="#f3f6f5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g aria-label="Devpulse wordmark">
    <text x="267" y="187" fill="#f3f6f5" font-family="Space Grotesk, Inter, Segoe UI, sans-serif" font-size="72" font-weight="600">Dev<tspan fill="#0df5c4">pulse</tspan></text>
    <path d="M271 213h360" stroke="#273331" stroke-width="1.5"/>
    <text x="271" y="244" fill="#9aaba8" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="500">CLOUD DEVELOPMENT PLATFORM</text>
  </g>

  <g aria-label="App icon preview">
    <path d="M731 102v176" stroke="#273331" stroke-width="1.5"/>
    <text x="789" y="137" fill="#899b97" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600">APP ICON</text>
    <rect x="787" y="157" width="104" height="104" rx="28" fill="#0df5c4"/>
    <path d="M813 184h16a29 29 0 0 1 0 58h-16z" fill="none" stroke="#081311" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M819 213h11l6-10 8 21 7-12h11" fill="none" stroke="#f4fffc" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="839" y="290" fill="#73817e" font-family="Inter, Segoe UI, sans-serif" font-size="10" text-anchor="middle">16px–256px</text>
  </g>

  <text x="80" y="340" fill="#60716d" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="500">DEV PULSE  /  IDENTITY CONCEPT  02</text>
</svg>
