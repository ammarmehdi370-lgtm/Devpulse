services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpulse}
      POSTGRES_DB: ${POSTGRES_DB:-devpulse}
    ports: ["5433:5432"]
    volumes: [devpulse-postgres:/var/lib/postgresql/data]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-devpulse} -d ${POSTGRES_DB:-devpulse}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: [devpulse-redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_MINIO_ROOT_USER:-devpulse}
      MINIO_ROOT_PASSWORD: ${S3_MINIO_ROOT_PASSWORD:-devpulse-local-password}
    ports: ["9000:9000", "9001:9001"]
    volumes: [devpulse-minio:/bitnami/minio/data]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    image: node:20-bookworm
    restart: unless-stopped
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @devpulse/web dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4001
      NEXT_PUBLIC_AI_URL: http://localhost:4002
    ports: ["3000:3000"]
    volumes: [".:/workspace", "web-node-modules:/workspace/node_modules"]
    depends_on:
      api:
        condition: service_healthy
      socket:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    image: node:20-bookworm
    restart: unless-stopped
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @devpulse/database db:generate && pnpm --filter @devpulse/api dev"
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 4000
      APP_URL: http://localhost:3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-devpulse}:${POSTGRES_PASSWORD:-devpulse}@postgres:5432/${POSTGRES_DB:-devpulse}?schema=public
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-devpulse}:${POSTGRES_PASSWORD:-devpulse}@postgres:5432/${POSTGRES_DB:-devpulse}?schema=public
      REDIS_URL: redis://redis:6379
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_BUCKET: devpulse-local
      AWS_ACCESS_KEY_ID: ${S3_MINIO_ROOT_USER:-devpulse}
      AWS_SECRET_ACCESS_KEY: ${S3_MINIO_ROOT_PASSWORD:-devpulse-local-password}
      JWT_SECRET: ${JWT_SECRET:-devpulse-development-secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/api/auth/google/callback}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:4000/api/auth/github/callback}
      SESSION_SECRET: ${SESSION_SECRET:-devpulse-development-oauth-session-secret}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-./keys/private.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-./keys/public.pem}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-30d}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@devpulse.io}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Devpulse}
    ports: ["4000:4000"]
    volumes: [".:/workspace", "api-node-modules:/workspace/node_modules"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  socket:
    image: node:20-bookworm
    restart: unless-stopped
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @devpulse/socket dev"
    environment:
      NODE_ENV: development
      SOCKET_PORT: 4001
      APP_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379
    ports: ["4001:4001"]
    volumes: [".:/workspace", "socket-node-modules:/workspace/node_modules"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ai:
    image: node:20-bookworm
    restart: unless-stopped
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @devpulse/ai dev"
    environment:
      NODE_ENV: development
      AI_PORT: 4002
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}
    ports: ["4002:4002"]
    volumes: [".:/workspace", "ai-node-modules:/workspace/node_modules"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mobile:
    image: node:20-bookworm
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @devpulse/mobile dev -- --lan"
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:4000
      EXPO_PUBLIC_SOCKET_URL: http://localhost:4001
    ports: ["8081:8081", "19000:19000", "19001:19001", "19002:19002"]
    volumes: [".:/workspace", "mobile-node-modules:/workspace/node_modules"]
    depends_on: [api]

volumes:
  devpulse-postgres:
  devpulse-redis:
  devpulse-minio:
  web-node-modules:
  api-node-modules:
  socket-node-modules:
  ai-node-modules:
  mobile-node-modules:
