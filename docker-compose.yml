x-workspace-volumes: &workspace-volumes
  - .:/workspace
  - workspace-node-modules:/workspace/node_modules
  - workspace-app-ai-node-modules:/workspace/apps/ai/node_modules
  - workspace-app-ai-worker-node-modules:/workspace/apps/ai-worker/node_modules
  - workspace-app-api-node-modules:/workspace/apps/api/node_modules
  - workspace-app-mobile-node-modules:/workspace/apps/mobile/node_modules
  - workspace-app-socket-node-modules:/workspace/apps/socket/node_modules
  - workspace-app-web-node-modules:/workspace/apps/web/node_modules
  - workspace-package-config-node-modules:/workspace/packages/config/node_modules
  - workspace-package-database-node-modules:/workspace/packages/database/node_modules
  - workspace-package-types-node-modules:/workspace/packages/types/node_modules
  - workspace-package-ui-node-modules:/workspace/packages/ui/node_modules
  - workspace-package-utils-node-modules:/workspace/packages/utils/node_modules

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpulse}
      POSTGRES_DB: ${POSTGRES_DB:-devpulse}
    ports:
      # HOST_PORT:CONTAINER_PORT. Host clients use localhost:5433 to avoid
      # conflicts with a local PostgreSQL installation; inside Compose,
      # PostgreSQL remains available as postgres:5432.
      # Host-side DATABASE_URL values must use port 5433.
      - "5433:5432"
    volumes: [devpulse-postgres:/var/lib/postgresql/data]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-devpulse} -d ${POSTGRES_DB:-devpulse}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb
    ports: ["6379:6379"]
    volumes: [devpulse-redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${S3_MINIO_ROOT_USER:-devpulse}}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY:-${S3_MINIO_ROOT_PASSWORD:-devpulse123}}
    ports: ["9000:9000", "9001:9001"]
    volumes: [devpulse-rustfs:/data]
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail --silent http://localhost:9000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio-init:
    image: amazon/aws-cli:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket "$$MINIO_BUCKET" ||
        aws --endpoint-url http://minio:9000 s3api create-bucket --bucket "$$MINIO_BUCKET"
        echo 'S3-compatible bucket ready'
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-${S3_MINIO_ROOT_USER:-devpulse}}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-${S3_MINIO_ROOT_PASSWORD:-devpulse123}}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      MINIO_BUCKET: ${MINIO_BUCKET:-devpulse-files}
    restart: "no"

  deps-init:
    image: node:20-bookworm
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install --frozen-lockfile"
    volumes: *workspace-volumes
    restart: "no"

  web:
    image: node:20-bookworm
    restart: unless-stopped
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm --filter @devpulse/web dev -H 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4001
      NEXT_PUBLIC_AI_URL: http://localhost:4002
    ports: ["3000:3000"]
    volumes: *workspace-volumes
    depends_on:
      deps-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      socket:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    image: node:20-bookworm
    restart: unless-stopped
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm --filter @devpulse/database db:generate && pnpm --filter @devpulse/api dev"
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 4000
      APP_URL: http://localhost:3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-devpulse}:${POSTGRES_PASSWORD:-devpulse}@postgres:5432/${POSTGRES_DB:-devpulse}?schema=public
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-devpulse}:${POSTGRES_PASSWORD:-devpulse}@postgres:5432/${POSTGRES_DB:-devpulse}?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-devpulse-files}
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_BUCKET: ${MINIO_BUCKET:-devpulse-files}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-${S3_MINIO_ROOT_USER:-devpulse}}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-${S3_MINIO_ROOT_PASSWORD:-devpulse123}}
      JWT_SECRET: ${JWT_SECRET:-devpulse-development-secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/api/auth/google/callback}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:4000/api/auth/github/callback}
      SESSION_SECRET: ${SESSION_SECRET:-devpulse-development-oauth-session-secret}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-./keys/private.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-./keys/public.pem}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-30d}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@devpulse.io}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Devpulse}
    ports: ["4000:4000"]
    volumes: *workspace-volumes
    depends_on:
      deps-init:
        condition: service_completed_successfully
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  socket:
    image: node:20-bookworm
    restart: unless-stopped
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm --filter @devpulse/socket dev"
    environment:
      NODE_ENV: development
      SOCKET_PORT: 4001
      APP_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379
    ports: ["4001:4001"]
    volumes: *workspace-volumes
    depends_on:
      deps-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ai:
    image: node:20-bookworm
    restart: unless-stopped
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm --filter @devpulse/ai dev"
    environment:
      NODE_ENV: development
      AI_PORT: 4002
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
    ports: ["4002:4002"]
    volumes: *workspace-volumes
    depends_on:
      deps-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mobile:
    image: node:20-bookworm
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm --filter @devpulse/mobile dev -- --lan"
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:4000
      EXPO_PUBLIC_SOCKET_URL: http://localhost:4001
    ports: ["8081:8081", "19000:19000", "19001:19001", "19002:19002"]
    volumes: *workspace-volumes
    depends_on:
      deps-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy

volumes:
  devpulse-postgres:
  devpulse-redis:
  devpulse-rustfs:
  workspace-node-modules:
  workspace-app-ai-node-modules:
  workspace-app-ai-worker-node-modules:
  workspace-app-api-node-modules:
  workspace-app-mobile-node-modules:
  workspace-app-socket-node-modules:
  workspace-app-web-node-modules:
  workspace-package-config-node-modules:
  workspace-package-database-node-modules:
  workspace-package-types-node-modules:
  workspace-package-ui-node-modules:
  workspace-package-utils-node-modules:
